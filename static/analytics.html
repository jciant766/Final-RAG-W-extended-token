<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client CRM - Maltese Law RAG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        h1 {
            color: #2d3748;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
        }

        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #718096;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #2d3748;
        }

        .users-table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .table-header {
            padding: 20px 30px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-title {
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .refresh-btn:hover {
            background: #5a67d8;
        }

        .refresh-btn:active {
            transform: scale(0.98);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f7fafc;
        }

        th {
            padding: 16px 24px;
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #718096;
            font-weight: 600;
        }

        td {
            padding: 20px 24px;
            border-top: 1px solid #e2e8f0;
            color: #2d3748;
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #f7fafc;
        }

        .username {
            font-weight: 600;
            color: #2d3748;
            font-size: 15px;
        }

        .email {
            color: #718096;
            font-size: 13px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-badge.hot {
            background: #fed7d7;
            color: #c53030;
        }

        .status-badge.warm {
            background: #feebc8;
            color: #c05621;
        }

        .status-badge.cold {
            background: #bee3f8;
            color: #2c5282;
        }

        .queries-count {
            font-weight: 600;
            color: #667eea;
            font-size: 18px;
        }

        .timestamp {
            text-align: center;
            color: #a0aec0;
            font-size: 12px;
            margin-top: 20px;
            padding: 20px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #718096;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #718096;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state-title {
            font-size: 20px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 16px;
            border-radius: 8px;
            margin: 20px;
        }

        .notes {
            font-size: 13px;
            color: #718096;
            font-style: italic;
        }

        .user-inactive {
            opacity: 0.5;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 0 30px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .filters {
            padding: 20px 30px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #718096;
            font-weight: 600;
        }

        .search-input {
            padding: 10px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            color: #2d3748;
            width: 250px;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-select {
            padding: 10px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            color: #2d3748;
            background: white;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .filter-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .clear-filters-btn {
            padding: 10px 16px;
            background: #e2e8f0;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            cursor: pointer;
            transition: background 0.2s;
            margin-left: auto;
        }

        .clear-filters-btn:hover {
            background: #cbd5e0;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #a0aec0;
        }

        @media (max-width: 768px) {
            .stats-overview {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 14px;
            }

            th, td {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>👥 Client CRM Dashboard</h1>
            <p class="subtitle">Track all your clients and their engagement</p>
        </header>

        <div class="stats-overview" id="stats-overview">
            <div class="stat-card">
                <div class="stat-label">Total Clients</div>
                <div class="stat-value" id="total-users">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Clients</div>
                <div class="stat-value" id="active-users">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Hot Leads</div>
                <div class="stat-value" id="hot-users">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Cost (USD)</div>
                <div class="stat-value" id="total-cost" style="color: #667eea;">-</div>
            </div>
        </div>

        <div class="users-table-container">
            <div class="table-header">
                <div class="table-title">All Clients</div>
                <button class="refresh-btn" onclick="loadAnalytics()">🔄 Refresh</button>
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label class="filter-label">Search</label>
                    <input
                        type="text"
                        class="search-input"
                        id="search-filter"
                        placeholder="Search by name or email..."
                        oninput="applyFilters()"
                    />
                </div>

                <div class="filter-group">
                    <label class="filter-label">Status</label>
                    <select class="filter-select" id="status-filter" onchange="applyFilters()">
                        <option value="all">All Status</option>
                        <option value="hot">🔥 Hot</option>
                        <option value="warm">⚠️ Warm</option>
                        <option value="cold">❄️ Cold</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label">Account</label>
                    <select class="filter-select" id="active-filter" onchange="applyFilters()">
                        <option value="all">All Accounts</option>
                        <option value="active">Active Only</option>
                        <option value="inactive">Inactive Only</option>
                    </select>
                </div>

                <button class="clear-filters-btn" onclick="clearFilters()">
                    ✕ Clear Filters
                </button>
            </div>

            <div id="content">
                <div class="loading">
                    <p>Loading clients...</p>
                </div>
            </div>
        </div>

        <div class="timestamp" id="timestamp"></div>
        <a href="/admin" class="back-link">← Back to Admin Dashboard</a>
    </div>

    <script>
        const ADMIN_KEY = 'your_admin_key_here'; // From .env
        let allUsers = []; // Store all users for filtering

        function formatDate(dateString) {
            if (!dateString) return 'Never';
            const date = new Date(dateString);
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatRelativeTime(dateString) {
            if (!dateString) return 'Never';
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

            if (diffHours < 1) return 'Just now';
            if (diffHours < 24) return `${diffHours}h ago`;
            if (diffDays === 1) return 'Yesterday';
            return `${diffDays}d ago`;
        }

        async function loadAnalytics() {
            const content = document.getElementById('content');
            const timestamp = document.getElementById('timestamp');

            content.innerHTML = '<div class="loading"><p>Loading clients...</p></div>';

            try {
                const response = await fetch(`/api/admin/analytics?admin_key=${ADMIN_KEY}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load analytics');
                }

                // Update stats overview
                document.getElementById('total-users').textContent = data.total_users || 0;
                document.getElementById('active-users').textContent = data.active_users || 0;

                const hotUsers = data.users.filter(u => u.status === 'hot').length;
                document.getElementById('hot-users').textContent = hotUsers;

                // Calculate total cost across all users
                const totalCost = data.users.reduce((sum, u) => {
                    return sum + (u.cost_stats?.total_cost_usd || 0);
                }, 0);
                document.getElementById('total-cost').textContent = '$' + totalCost.toFixed(4);

                // Store users globally for filtering
                allUsers = data.users;

                // Check if we have users
                if (!data.users || data.users.length === 0) {
                    content.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <div class="empty-state-title">No Clients Yet</div>
                            <div class="empty-state-description">
                                Clients will appear here once they start using the system.
                            </div>
                        </div>
                    `;
                    timestamp.textContent = `Last checked: ${new Date().toLocaleString()}`;
                    return;
                }

                // Apply filters and render table
                applyFilters();
                let tableHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Client</th>
                                <th>Status</th>
                                <th>Queries</th>
                                <th>Last Active</th>
                                <th>Created</th>
                                <th>Notes</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                return tableHTML;
            } catch (error) {
                content.innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> ${error.message}
                    </div>
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <div class="empty-state-title">Failed to Load Analytics</div>
                        <div class="empty-state-description">
                            Please check your admin key and try again.
                        </div>
                    </div>
                `;
                timestamp.textContent = `Failed at: ${new Date().toLocaleString()}`;
            }
        }

        function applyFilters() {
            const searchTerm = document.getElementById('search-filter').value.toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;
            const activeFilter = document.getElementById('active-filter').value;

            // Filter users
            let filteredUsers = allUsers.filter(user => {
                // Search filter
                const matchesSearch = searchTerm === '' ||
                    user.username.toLowerCase().includes(searchTerm) ||
                    (user.email && user.email.toLowerCase().includes(searchTerm)) ||
                    (user.notes && user.notes.toLowerCase().includes(searchTerm));

                // Status filter
                const matchesStatus = statusFilter === 'all' || user.status === statusFilter;

                // Active filter
                const matchesActive = activeFilter === 'all' ||
                    (activeFilter === 'active' && user.is_active) ||
                    (activeFilter === 'inactive' && !user.is_active);

                return matchesSearch && matchesStatus && matchesActive;
            });

            // Render filtered table
            renderTable(filteredUsers);
        }

        function renderTable(users) {
            const content = document.getElementById('content');
            const timestamp = document.getElementById('timestamp');

            if (users.length === 0) {
                content.innerHTML = `
                    <div class="no-results">
                        <p>No clients match your filters.</p>
                    </div>
                `;
                timestamp.textContent = `Last updated: ${new Date().toLocaleString()} (${users.length} results)`;
                return;
            }

            let tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Client</th>
                            <th>Status</th>
                            <th>Queries</th>
                            <th>Total Cost</th>
                            <th>Avg/Query</th>
                            <th>Last Active</th>
                            <th>Created</th>
                            <th>Notes</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            users.forEach(user => {
                const rowClass = user.is_active ? '' : 'user-inactive';
                const costStats = user.cost_stats || {};
                const totalCost = costStats.total_cost_usd || 0;
                const avgCost = costStats.avg_cost_per_query || 0;

                tableHTML += `
                    <tr class="${rowClass}">
                        <td>
                            <div class="username">${user.username}</div>
                            ${user.email ? `<div class="email">${user.email}</div>` : ''}
                        </td>
                        <td>
                            <span class="status-badge ${user.status}">
                                ${user.status_emoji} ${user.status_text}
                            </span>
                        </td>
                        <td>
                            <div class="queries-count">${user.total_queries}</div>
                        </td>
                        <td>
                            <div style="font-weight: 600; color: #667eea;">$${totalCost.toFixed(4)}</div>
                        </td>
                        <td>
                            <div style="font-size: 13px; color: #718096;">$${avgCost.toFixed(4)}</div>
                        </td>
                        <td>${formatRelativeTime(user.last_active)}</td>
                        <td>${formatDate(user.created_at)}</td>
                        <td>
                            ${user.notes ? `<span class="notes">${user.notes}</span>` : '-'}
                        </td>
                    </tr>
                `;
            });

            tableHTML += `
                    </tbody>
                </table>
            `;

            content.innerHTML = tableHTML;
            timestamp.textContent = `Last updated: ${new Date().toLocaleString()} (${users.length} of ${allUsers.length} clients)`;
        }

        function clearFilters() {
            document.getElementById('search-filter').value = '';
            document.getElementById('status-filter').value = 'all';
            document.getElementById('active-filter').value = 'all';
            applyFilters();
        }

        // Auto-refresh every 30 seconds
        setInterval(loadAnalytics, 30000);

        // Load on page load
        loadAnalytics();
    </script>
</body>
</html>
