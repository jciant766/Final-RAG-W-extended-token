<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - User Tracking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .auth-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .auth-box h2 {
            margin-bottom: 20px;
            color: #667eea;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        .stat-card .number {
            font-size: 3em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card .label {
            color: #666;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .users-table {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        th:first-child {
            border-top-left-radius: 10px;
        }

        th:last-child {
            border-top-right-radius: 10px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        tr:hover {
            background: #f8f9ff;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .btn-view {
            padding: 8px 16px;
            font-size: 14px;
            background: #667eea;
        }

        .btn-deactivate {
            padding: 8px 16px;
            font-size: 14px;
            background: #dc3545;
            margin-left: 5px;
        }

        .recent-queries {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-top: 20px;
        }

        .query-item {
            padding: 15px;
            border-left: 4px solid #667eea;
            background: #f8f9ff;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .query-item .time {
            color: #999;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .query-item .text {
            color: #333;
            font-weight: 500;
        }

        .hidden {
            display: none;
        }

        .error {
            color: #dc3545;
            padding: 10px;
            background: #f8d7da;
            border-radius: 8px;
            margin: 10px 0;
        }

        .success {
            color: #155724;
            padding: 10px;
            background: #d4edda;
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Dashboard</h1>

        <!-- Admin Authentication -->
        <div id="authBox" class="auth-box">
            <h2>Admin Login</h2>
            <div class="input-group">
                <label for="adminKey">Admin Key</label>
                <input type="password" id="adminKey" placeholder="Enter admin key">
            </div>
            <button onclick="authenticate()">Login</button>
            <div id="authError" class="error hidden"></div>
        </div>

        <!-- Dashboard Content (hidden until authenticated) -->
        <div id="dashboard" class="hidden">
            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="number" id="totalUsers">0</div>
                    <div class="label">Total Users</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="activeUsers">0</div>
                    <div class="label">Active Users</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="totalQueries">0</div>
                    <div class="label">Total Queries</div>
                </div>
            </div>

            <!-- Users Table -->
            <div class="users-table">
                <h2 style="margin-bottom: 20px; color: #667eea;">Users</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Created</th>
                            <th>Total Queries</th>
                            <th>Last Login</th>
                            <th>Status</th>
                            <th>Notes</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Will be populated by JS -->
                    </tbody>
                </table>
            </div>

            <!-- User Details Modal (shown when viewing specific user) -->
            <div id="userDetails" class="recent-queries hidden">
                <h2 id="userDetailsTitle" style="margin-bottom: 20px; color: #667eea;"></h2>
                <div id="userDetailsContent"></div>
            </div>
        </div>
    </div>

    <script>
        let adminKey = '';

        function authenticate() {
            const key = document.getElementById('adminKey').value.trim();
            if (!key) {
                showError('authError', 'Please enter admin key');
                return;
            }

            adminKey = key;

            // Test authentication by fetching users
            fetch(`/api/admin/users?admin_key=${encodeURIComponent(adminKey)}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Invalid admin key');
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('authBox').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    loadDashboard();
                })
                .catch(error => {
                    showError('authError', error.message);
                });
        }

        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        }

        function loadDashboard() {
            fetch(`/api/admin/users?admin_key=${encodeURIComponent(adminKey)}`)
                .then(response => response.json())
                .then(data => {
                    const users = data.users;

                    // Update stats
                    document.getElementById('totalUsers').textContent = users.length;
                    document.getElementById('activeUsers').textContent = users.filter(u => u.is_active).length;
                    document.getElementById('totalQueries').textContent = users.reduce((sum, u) => sum + u.total_queries, 0);

                    // Populate users table
                    const tbody = document.getElementById('usersTableBody');
                    tbody.innerHTML = '';

                    users.forEach(user => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${user.id}</td>
                            <td><strong>${user.username}</strong></td>
                            <td>${user.email || 'N/A'}</td>
                            <td>${formatDate(user.created_at)}</td>
                            <td>${user.total_queries}</td>
                            <td>${user.last_login ? formatDate(user.last_login) : 'Never'}</td>
                            <td><span class="status-badge ${user.is_active ? 'status-active' : 'status-inactive'}">${user.is_active ? 'Active' : 'Inactive'}</span></td>
                            <td>${user.notes || ''}</td>
                            <td>
                                <button class="btn-view" onclick="viewUserDetails(${user.id}, '${user.username}')">View</button>
                                ${user.is_active ? `<button class="btn-deactivate" onclick="deactivateUser(${user.id})">Deactivate</button>` : ''}
                            </td>
                        `;
                        tbody.appendChild(row);
                    });
                })
                .catch(error => {
                    console.error('Error loading dashboard:', error);
                });
        }

        function viewUserDetails(userId, username) {
            fetch(`/api/admin/users/${userId}/stats?admin_key=${encodeURIComponent(adminKey)}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('userDetailsTitle').textContent = `Recent Queries - ${username}`;

                    const content = document.getElementById('userDetailsContent');
                    content.innerHTML = '';

                    if (data.recent_queries.length === 0) {
                        content.innerHTML = '<p>No queries yet.</p>';
                    } else {
                        data.recent_queries.forEach(q => {
                            const item = document.createElement('div');
                            item.className = 'query-item';
                            item.innerHTML = `
                                <div class="time">${formatDate(q.timestamp)} - Response: ${q.response_length} chars, ${q.sources_count} sources</div>
                                <div class="text">${escapeHtml(q.query)}</div>
                            `;
                            content.appendChild(item);
                        });
                    }

                    document.getElementById('userDetails').classList.remove('hidden');
                })
                .catch(error => {
                    console.error('Error loading user details:', error);
                });
        }

        function deactivateUser(userId) {
            if (!confirm('Are you sure you want to deactivate this user?')) {
                return;
            }

            fetch(`/api/admin/users/${userId}/deactivate?admin_key=${encodeURIComponent(adminKey)}`, {
                method: 'POST'
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('User deactivated successfully');
                        loadDashboard();
                    }
                })
                .catch(error => {
                    console.error('Error deactivating user:', error);
                    alert('Failed to deactivate user');
                });
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Refresh dashboard every 30 seconds
        setInterval(() => {
            if (!document.getElementById('dashboard').classList.contains('hidden')) {
                loadDashboard();
            }
        }, 30000);
    </script>
</body>
</html>
